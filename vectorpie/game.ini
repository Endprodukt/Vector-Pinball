; Vector Pinball - Paket fuer das VectorPie-Menue (sdk/docs/07-packages.md)
id           = vpinball
name         = Vector Pinball
manufacturer = Other
executable   = pinball
version      = 0.1.0
sdk          = 0.1
author       = Brian Nenninger (dozingcat), VectorPie port Oliver Carell (Endprodukt)
hiscores     = yes
marquee      = marquee.png

; Everything below can also be set on the machine, in the service menu: F2.
; Its EXIT writes save/settings.ini, and what stands there goes before what
; stands here. (An update of the game replaces this file, not that one.)

; yes: START needs no coin.
free_play     = no

; Sound while nobody is playing (title, demo game): yes or no.
attract_sound = no

; How loud, each 0 to 10: everything, and the effects. (The music's volume is
; set in the service menu too and kept with the game's other settings.)
master_volume  = 10
effects_volume = 10

; Which control does what. Set it in the service menu (F2, CONTROLS): pick
; a line, press START, then press the key or button or move the axis you
; want - any key, joystick button, hat, axis or mouse button, straight from
; the device, whatever advmame.rc says. The first since the cursor came to
; the line replaces, every further START adds one (up to four; ", " between
; them); left / right: none or the standard, Delete: the standard. One
; control may do several things. It is kept in save/settings.ini.
; Written by hand: key:Left Ctrl, joy0:b3 (button 4 of the first joystick),
; joy0:h0:u (hat up), joy0:a1+ (axis as a button), mouse:b1, "none" = off.
; The two axes take a whole axis, joy0:a0, "~" behind turns it around:
; nudge_axis pushes the table sideways, yoke_axis pulls the plunger (pulled
; back) and nudges up (pushed) - a yoke. They are off until set.
; The defaults are built into the game (they cannot stand here: the menu
; takes ':' as a separator): the keys, buttons and mouse buttons AdvanceMAME
; gives these (old advmame.rc names, p1_button1 ..., are read as those). The nudges push the
; table (too often: TILT). The ball goes only with the plunger: its button
; pulls it while held (digital), or the yoke (analog). Several buttons on
; one function: both left yoke buttons on the left flipper, for instance.
; Coin, START, F2 and TAB stay as well; F2 opens the service menu always,
; in a game too. START launches nothing in the game, it changes the view
; there (full width, closer, closest, whole table); start_button,
; coin_button and service_button add one more control each.
spare_button         = none
nudge_axis           = none
yoke_axis            = none
start_button         = none
coin_button          = none
service_button       = none
